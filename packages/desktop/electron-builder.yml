appId: com.jsmart.desktop
productName: JSmart Desktop
directories:
  buildResources: resources
  output: dist/release
files:
  - dist/**/*
  - "!dist/release/**"
  - package.json
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
linux:
  target:
    - AppImage
    - deb
win:
  target:
    - nsis
